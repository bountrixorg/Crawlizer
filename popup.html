<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Katana Web Crawler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="Katana" width="24" height="24">
        <span class="title">KATANA</span>
        <span class="badge">v1.0</span>
      </div>
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Idle</span>
      </div>
    </div>

    <div class="quick-stats">
      <div class="stat-box">
        <div class="stat-value" id="stat-targets">0</div>
        <div class="stat-label">Seeds</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-crawled">0</div>
        <div class="stat-label">Crawled</div>
      </div>
      <div class="stat-box highlight">
        <div class="stat-value" id="stat-discovered">0</div>
        <div class="stat-label">Discovered</div>
      </div>
    </div>

    <div class="upload-section">
      <label for="popup-file-input" class="upload-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Upload .TXT File</span>
      </label>
      <input type="file" id="popup-file-input" accept=".txt">
      <div class="upload-info" id="upload-info">Select a text file with seed URLs</div>
    </div>

    <div class="actions">
      <button id="btn-quick-start" class="btn btn-primary" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Start Crawl</span>
      </button>
      <button id="btn-open-dashboard" class="btn btn-outline">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <span>Open Full Dashboard</span>
      </button>
    </div>

    <div class="footer">
      <span>ProjectDiscovery Katana Engine Port</span>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
